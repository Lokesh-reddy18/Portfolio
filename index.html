    <!-- Applies the saved/OS theme before React mounts so the page never flashes light. -->
    <script>
      try {
        var saved = localStorage.getItem('darkMode');
        var dark = saved !== null ? saved === 'true' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Static copy of the React contact form: Netlify only detects forms present in the built HTML. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
