    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Applies the saved/OS theme before React mounts so the page never flashes light. -->
    <script>
      try {
        var saved = localStorage.getItem('darkMode');
        var dark = saved !== null ? saved === 'true' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
